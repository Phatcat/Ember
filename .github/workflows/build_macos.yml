name: macOS (Clang) CI
on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  # macOS – Cached Debug Build
  Apple_Silicon_debug:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Cache Dependencies and Homebrew
        uses: actions/cache@v3
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
            dependencies
          key: macOS-deps
          restore-keys: macOS-deps

      - name: Cache Build Folder
        uses: actions/cache@v3
        with:
          path: build
          key: macOS-build-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: macOS-build-

      - name: Run macOS Build Script
        run: |
          chmod +x ./docs/scripts/build_macos.sh
          ./docs/scripts/build_macos.sh
