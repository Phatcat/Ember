name: Docker Buildrunner

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
####################################################################
# Linux – Docker Build
####################################################################
  Linux_Ubuntu_ARM64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --file Dockerfile
