name: Docker Image CI

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: Phatcat
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and cache Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/phatcat/ember:latest
          # Pull cache from GHCR
          cache-from: type=registry,ref=ghcr.io/phatcat/ember-cache:cache,mode=max
          # Push cache to GHCR after building
          cache-to: type=registry,ref=ghcr.io/phatcat/ember-cache:cache,mode=max,compression=zstd
